name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2
    permissions:
      contents: write
      pull-requests: write
    with:
      enable-summary: true
    secrets: inherit

  release:
    needs: ci
    if: ${{ github.event_name == 'push' }}
    uses: Taure/erlang-ci/.github/workflows/release.yml@v2.3.2
    permissions:
      contents: write

  hex-publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: Taure/erlang-ci/.github/workflows/hex-publish.yml@v2.3.2
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag }}
